{% extends "base.html" %}

{% block title %}会員登録 | 飲食店予約アプリ{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>会員登録</h1>
  <p>登録後、ログイン画面に移動します。</p>
  <form class="auth-form" method="post" action="{% url 'accounts:signup' %}">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="button" type="submit">会員登録</button>
  </form>
  <p>登録済みの方は<a href="{% url 'accounts:login' %}">ログイン</a></p>
</section>
{% endblock %}
