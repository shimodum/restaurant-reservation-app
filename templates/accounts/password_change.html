{% extends "base.html" %}

{% block title %}パスワード変更 | 飲食店予約アプリ{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>パスワード変更</h1>
  <form class="auth-form" method="post" action="{% url 'accounts:password_change' %}">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="button" type="submit">パスワードを変更</button>
  </form>
  <p><a href="{% url 'accounts:mypage' %}">マイページへ戻る</a></p>
</section>
{% endblock %}
