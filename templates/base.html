{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}飲食店予約アプリ{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'reservations/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="{% url 'home' %}">飲食店予約アプリ</a>
      <nav aria-label="メインナビゲーション">
        <a href="{% url 'reservations:restaurant_list' %}">店舗一覧</a>
        <a href="{% url 'admin:index' %}">管理画面</a>
        {% if user.is_authenticated %}
          <span class="nav-username">{{ user.username }}</span>
          <form class="logout-form" method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button class="logout-button" type="submit">ログアウト</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:signup' %}">会員登録</a>
          <a href="{% url 'accounts:login' %}">ログイン</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
