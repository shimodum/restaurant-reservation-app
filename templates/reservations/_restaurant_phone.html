<dt>電話番号</dt>
<dd>
{% with phone=restaurant.phone_number_tel %}
  {% if phone %}
    <a href="tel:{{ phone }}">{{ restaurant.phone_number }}</a>
  {% elif restaurant.phone_number %}
    このページの店舗の電話番号は不正なため、電話リンクを表示できません。
  {% elif is_demo_restaurant %}
    03-XXXX-XXXX（デモ用・発信不可）
  {% else %}
    このページには店舗の電話番号が登録されていません。
  {% endif %}
{% endwith %}
</dd>
